<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5d6b63"/></marker>
  </defs>
  <rect width="1000" height="470" rx="18" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="999" height="469" rx="18" fill="none" stroke="#dfe8e3"/>
  <text x="32" y="42" font-size="19" font-weight="700" fill="#16352a">시스템 구조</text>
  <text x="32" y="64" font-size="12.5" fill="#5d6b63">하드웨어(센서 · 회로 · ESP32 펌웨어 · LCD)는 김은성, 데이터베이스 · PC · 앱 · 케이스는 팀원 담당</text>

  <!-- hardware boundary -->
  <rect x="24" y="84" width="600" height="362" rx="14" fill="#f4f8f5" stroke="#cfe0d5" stroke-dasharray="6 5"/>
  <text x="40" y="106" font-size="12" font-weight="700" fill="#1f8a4c">하드웨어 · 펌웨어 (김은성)</text>

  <!-- inputs -->
  <g font-size="12.5" fill="#2b3a33">
    <rect x="44" y="122" width="190" height="64" rx="10" fill="#fff" stroke="#cfe0d5"/>
    <text x="58" y="146" font-weight="700">로드셀 5 kg + HX711</text>
    <text x="58" y="168" fill="#5d6b63" font-size="11.5">수액 무게 · DT 12 / SCK 13</text>
    <rect x="44" y="198" width="190" height="64" rx="10" fill="#fff" stroke="#cfe0d5"/>
    <text x="58" y="222" font-weight="700">TCRT5000 광센서</text>
    <text x="58" y="244" fill="#5d6b63" font-size="11.5">점적통 방울 감지 · GPIO 4</text>
    <rect x="44" y="274" width="190" height="64" rx="10" fill="#fff" stroke="#cfe0d5"/>
    <text x="58" y="298" font-weight="700">버튼 2개</text>
    <text x="58" y="320" fill="#5d6b63" font-size="11.5">측정 시작 GPIO 5 · 재시작 18</text>
    <rect x="44" y="350" width="190" height="64" rx="10" fill="#fff" stroke="#cfe0d5"/>
    <text x="58" y="374" font-weight="700">NTP 시간</text>
    <text x="58" y="396" fill="#5d6b63" font-size="11.5">pool.ntp.org · KST</text>
  </g>

  <!-- ESP32 -->
  <rect x="290" y="150" width="170" height="210" rx="14" fill="#1f2a30"/>
  <text x="375" y="182" font-size="15" font-weight="700" fill="#e8f0ec" text-anchor="middle">ESP32 LOLIN</text>
  <g font-size="11.5" fill="#cfd8dc" text-anchor="middle">
    <text x="375" y="214">10초 동안</text>
    <text x="375" y="232">무게 변화 Δw · 방울 수 n</text>
    <text x="375" y="262" fill="#7fd7a2">속도 = Δw / 10 s</text>
    <text x="375" y="282" fill="#7fd7a2">남은 시간 = 남은 무게 / 속도</text>
    <text x="375" y="302" fill="#7fd7a2">종료 = 현재 + 남은 시간</text>
    <text x="375" y="332">진행률 = 1 − 현재 / 시작</text>
  </g>
  <g stroke="#5d6b63" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M234 154 C 262 154, 262 200, 288 200"/>
    <path d="M234 230 C 262 230, 262 236, 288 236"/>
    <path d="M234 306 C 262 306, 262 280, 288 280"/>
    <path d="M234 382 C 262 382, 262 320, 288 320"/>
  </g>

  <!-- LCD -->
  <rect x="490" y="130" width="116" height="78" rx="10" fill="#1d4fd8"/>
  <text x="548" y="160" font-size="12" fill="#e6eeff" text-anchor="middle" font-family="monospace">endT 12:05:35</text>
  <text x="548" y="180" font-size="12" fill="#e6eeff" text-anchor="middle" font-family="monospace">progress:0%</text>
  <text x="548" y="226" font-size="11.5" fill="#5d6b63" text-anchor="middle">LCD 16×2 (I2C 0x27)</text>
  <text x="548" y="242" font-size="11" fill="#8fa59a" text-anchor="middle">환자 · 보호자용</text>
  <path d="M460 190 L 488 172" stroke="#5d6b63" stroke-width="1.6" fill="none" marker-end="url(#a)"/>

  <!-- case -->
  <rect x="490" y="290" width="116" height="90" rx="10" fill="#fff" stroke="#dfe8e3" stroke-dasharray="4 3"/>
  <text x="548" y="320" font-size="12.5" font-weight="700" fill="#2b3a33" text-anchor="middle">3D 프린팅 케이스</text>
  <text x="548" y="342" font-size="11.5" fill="#5d6b63" text-anchor="middle">16 × 7 × 10 cm</text>
  <text x="548" y="360" font-size="11" fill="#8fa59a" text-anchor="middle">Rhino 3D · 팀원</text>

  <!-- cloud -->
  <path d="M460 270 C 560 270, 600 260, 660 250" stroke="#e07b24" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="560" y="262" font-size="11" fill="#e07b24" text-anchor="middle">Wi-Fi</text>
  <rect x="664" y="196" width="150" height="110" rx="14" fill="#fff6e6" stroke="#f0c58a"/>
  <text x="739" y="224" font-size="13.5" font-weight="700" fill="#8a4b00" text-anchor="middle">Firebase RTDB</text>
  <g font-size="11" fill="#7a5a2e" font-family="monospace">
    <text x="680" y="248">/802/StartWeight</text>
    <text x="680" y="264">/802/StartTime</text>
    <text x="680" y="280">/802/EndTime</text>
    <text x="680" y="296">/802/speed</text>
  </g>

  <!-- consumers -->
  <rect x="852" y="140" width="126" height="76" rx="12" fill="#fff" stroke="#dfe8e3"/>
  <text x="915" y="172" font-size="12.5" font-weight="700" fill="#2b3a33" text-anchor="middle">간호사실 PC</text>
  <text x="915" y="192" font-size="11" fill="#8fa59a" text-anchor="middle">WPF · 팀원</text>
  <rect x="852" y="290" width="126" height="76" rx="12" fill="#fff" stroke="#dfe8e3"/>
  <text x="915" y="322" font-size="12.5" font-weight="700" fill="#2b3a33" text-anchor="middle">Android 앱</text>
  <text x="915" y="342" font-size="11" fill="#8fa59a" text-anchor="middle">병실별 현황 · 팀원</text>
  <g stroke="#5d6b63" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M814 236 C 832 236, 832 178, 850 178"/>
    <path d="M814 268 C 832 268, 832 328, 850 328"/>
  </g>
  <text x="915" y="420" font-size="11" fill="#8fa59a" text-anchor="middle">PC · 앱 코드는 이 레포에 없음</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
